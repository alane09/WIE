<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-image: url("AG.jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            margin: 0;
            padding: 0;
        }

        h1 {
            text-align: center;
            color: #fff;
            padding: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        h2 {
            text-align: center;
            color: #fff;
            padding: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        .button-container {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        button {
            margin: 20px;
            padding: 10px 20px;
            font-size: 16px;
            background-color: #ff00ff; /* pink */
            color: #800080; /* purple */
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #ff99ff; /* light pink */
        }

        footer {
            text-align: center;
            margin-top: 50px;
            background-color: rgba(255, 255, 255, 0.7);
            padding: 10px;
        }

        footer img {
            width: 100px;
            margin: 10px;
        }

        .logo-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-container img {
            width: 150px; /* Increase the width for clearer logos */
            margin: 10px;
        }
    </style>
</head>
<body>
    <h1>IEEE WIE ENSTAB AFFINITY GROUP</h1>
    <h2>Welcome to Our Community</h2>
    
    <div class="button-container">
        <button onclick="window.location.href = 'Beneficaire.html';" style="background-color: #ff00ff; width: 300px; height: 100px;">Visitor  Space</button>
        <button onclick="window.location.href = 'page3.html';" style="background-color: #ff00ff; width: 300px; height: 100px;">Editor  Space</button>
    </div>

    <footer>
        <div class="logo-container">
            <img src="wie.png" alt="WIE Logo" style="width: 150px;"> <!-- Increase the width for clearer logo -->
            <img src="IEEE LOGO-black.png" alt="IEEE Logo" style="width: 150px;"> <!-- Increase the width for clearer logo -->
        </div>
    </footer>
</body>
</html>
